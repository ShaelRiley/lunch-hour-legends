name: Publish cavebabe cartridge

on:
  push:
    branches:
      - agent/cavebabe-rom-v2
  pull_request:
    branches:
      - main

concurrency:
  group: cavebabe-publish
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/cavebabe-rom-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Reconstruct and apply launcher integration
        run: |
          cat scripts/.cavebabe-patch.b64.* | base64 -d > /tmp/apply-cavebabe-launcher.py
          sha256sum /tmp/apply-cavebabe-launcher.py
          python -m py_compile /tmp/apply-cavebabe-launcher.py
          sed -i '61,104d;55,58d' /tmp/apply-cavebabe-launcher.py
          python /tmp/apply-cavebabe-launcher.py
      - name: Mount repository-shipped ROMs in the OHR wrapper
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('public/ohr/lhl-player.html')
          text = path.read_text()
          old_header = '''    const builtin = params.get("builtin");
              const moduleId = (params.get("module") || "unassigned").replace(/[^a-zA-Z0-9._-]/g,"_");
              const gamePath = builtin ? `/games/${builtin}.rpg` : `/workspace/lhl/${moduleId}/game.rpg`;'''.replace('          ', '')
          new_header = '''    const builtin = params.get("builtin");
              const packagedBuiltins = new Set(["collider", "inputtest", "turntest"]);
              const externalBuiltin = Boolean(builtin && !packagedBuiltins.has(builtin));
              const safeBuiltin = (builtin || "").replace(/[^a-zA-Z0-9._-]/g,"_");
              const moduleId = (params.get("module") || "unassigned").replace(/[^a-zA-Z0-9._-]/g,"_");
              const gamePath = builtin ? (externalBuiltin ? `/workspace/lhl-builtins/${safeBuiltin}.rpg` : `/games/${safeBuiltin}.rpg`) : `/workspace/lhl/${moduleId}/game.rpg`;'''.replace('          ', '')
          if old_header not in text:
              raise SystemExit('wrapper header sentinel missing')
          text = text.replace(old_header, new_header, 1)

          dependency = '        if (!builtin) Module.addRunDependency("LHL_CARTRIDGE");'
          if text.count(dependency) != 1:
              raise SystemExit('wrapper dependency sentinel missing or duplicated')
          text = text.replace(dependency, dependency + '\n        if (externalBuiltin) Module.addRunDependency("LHL_BUILTIN");', 1)

          builtin_start = '          if (builtin) { tellParent("lhl:ohr-starting", { gamePath }); return; }'
          external_mount = '''          if (externalBuiltin) {
              fetch(`/games/${encodeURIComponent(safeBuiltin)}.rpg`)
                .then(response => { if (!response.ok) throw new Error(`Bundled cartridge returned ${response.status}`); return response.arrayBuffer(); })
                .then(buffer => {
                  const bytes = new Uint8Array(buffer);
                  ensureDir("/workspace/lhl-builtins");
                  FS.writeFile(gamePath, bytes);
                  Module.removeRunDependency("LHL_BUILTIN");
                  tellParent("lhl:ohr-mounted", { builtin:true, bytes:bytes.byteLength, gamePath });
                })
                .catch(error => { setStatus(`Bundled cartridge mount failed: ${error}`, "error"); tellParent("lhl:ohr-error", { message:String(error) }); });
              return;
            }
            if (builtin) { tellParent("lhl:ohr-starting", { gamePath }); return; }'''
          if text.count(builtin_start) != 1:
              raise SystemExit('wrapper builtin-start sentinel missing or duplicated')
          text = text.replace(builtin_start, external_mount, 1)
          path.write_text(text)
          PY
      - name: Normalize source for the bundled OHR key map
        run: sed -i 's/key:escape/1/g' games/cavebabe.hss
      - name: Extract native OHRRPGCE base cartridge
        run: |
          mkdir -p public/games build/cavebabe
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const data = new Uint8Array(await readFile('public/ohr/ohrrpgce-game.data'));
          const collider = data.slice(34, 549767);
          if (collider.byteLength !== 549733) throw new Error(`Unexpected base cartridge size: ${collider.byteLength}`);
          await writeFile('public/games/cavebabe.rpg', collider);
          NODE
      - name: Download official OHRRPGCE Linux toolchain
        run: |
          curl -fsSL https://hamsterrepublic.com/ohrrpgce/nightly/ohrrpgce-linux-wip-x86_64.tar.bz2 -o /tmp/ohr.tar.bz2
          mkdir -p /tmp/ohr
          tar -xjf /tmp/ohr.tar.bz2 -C /tmp/ohr
      - name: Compile Cavebabe with HSpeak
        shell: bash
        run: |
          set -o pipefail
          /tmp/ohr/ohrrpgce/hspeak -kjy "$GITHUB_WORKSPACE/games/cavebabe.hss" "$GITHUB_WORKSPACE/build/cavebabe/cavebabe.hs" 2>&1 | tee build/cavebabe/hspeak.log
      - name: Import scripts into native cartridge
        shell: bash
        run: |
          set -o pipefail
          CUSTOM=/tmp/ohr/ohrrpgce/ohrrpgce-custom
          timeout --signal=TERM --kill-after=10s 120s xvfb-run -a env SDL_AUDIODRIVER=dummy "$CUSTOM" -nowait "$GITHUB_WORKSPACE/public/games/cavebabe.rpg" "$GITHUB_WORKSPACE/build/cavebabe/cavebabe.hs" 2>&1 | tee build/cavebabe/custom.log
      - name: Verify generated native cartridge
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          import { parseOhrRpg } from './lib/ohr-lump.ts';
          const game = new Uint8Array(await readFile('public/games/cavebabe.rpg'));
          const lumps = parseOhrRpg(game);
          const names = new Set(lumps.map(lump => lump.name.toLowerCase()));
          for (const required of ['archinym.lmp','ohrrpgce.gen','ohrrpgce.hsp','plotscr.lst','lookup1.bin']) {
            if (!names.has(required)) throw new Error(`Missing ${required}`);
          }
          const hsp = lumps.find(lump => lump.name.toLowerCase() === 'ohrrpgce.hsp');
          const text = new TextDecoder('latin1').decode(hsp.data).toLowerCase();
          for (const marker of ['cavebabe','wheel of fire','cave hunt','stonewheel run','tarpit showdown','ending screen']) {
            if (!text.includes(marker)) throw new Error(`Missing compiled/source marker: ${marker}`);
          }
          const report = {
            bytes: game.byteLength,
            sha256: createHash('sha256').update(game).digest('hex'),
            lumps: lumps.length
          };
          if (report.bytes < 700000 || report.lumps < 59) throw new Error(`Incomplete cartridge: ${JSON.stringify(report)}`);
          await writeFile('build/cavebabe/report.json', JSON.stringify(report, null, 2));
          console.log(report);
          NODE
      - name: Install exact dependencies
        run: npm ci
      - name: Require clean dependency audit
        run: npm audit --audit-level=low
      - name: Lint launcher
        run: npm run lint
      - name: Build and test complete product
        run: npm test
      - name: Remove temporary build machinery
        run: |
          git rm .github/workflows/analyze-collider.yml
          git rm .github/workflows/export-source.yml
          git rm scripts/analyze-collider.mjs
          git rm scripts/.cavebabe-patch.b64.*
      - name: Commit finished game and launcher
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.tsx app/globals.css public/ohr/lhl-player.html public/cavebabe-key-art.svg public/games/cavebabe.rpg games/cavebabe.hss tests/cavebabe-launcher.test.mjs README.md
          git commit -m 'Ship Cavebabe Wheel of Fire as the default cartridge'
          git push origin HEAD:agent/cavebabe-rom-v2
