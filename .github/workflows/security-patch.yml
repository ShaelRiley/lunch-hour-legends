name: Security patch validation

on:
  push:
    branches:
      - agent/patch-react-rsc-cve-2026-44907
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out security branch
        uses: actions/checkout@v4
        with:
          ref: agent/patch-react-rsc-cve-2026-44907

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Regenerate lockfile from patched manifest
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Apply non-breaking transitive security fixes
        run: npm audit fix --package-lock-only --ignore-scripts || true

      - name: Verify patched dependency resolution
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const lock = JSON.parse(await readFile('package-lock.json', 'utf8'));
          const checks = [
            ['root next', lock.packages?.['']?.dependencies?.next, '16.2.12'],
            ['root react', lock.packages?.['']?.dependencies?.react, '19.2.8'],
            ['root react-dom', lock.packages?.['']?.dependencies?.['react-dom'], '19.2.8'],
            ['root @cloudflare/vite-plugin', lock.packages?.['']?.devDependencies?.['@cloudflare/vite-plugin'], '1.50.0'],
            ['root react-server-dom-webpack', lock.packages?.['']?.devDependencies?.['react-server-dom-webpack'], '19.2.8'],
            ['root vite', lock.packages?.['']?.devDependencies?.vite, '8.2.0'],
            ['root wrangler', lock.packages?.['']?.devDependencies?.wrangler, '4.114.0'],
            ['resolved next', lock.packages?.['node_modules/next']?.version, '16.2.12'],
            ['resolved react', lock.packages?.['node_modules/react']?.version, '19.2.8'],
            ['resolved react-dom', lock.packages?.['node_modules/react-dom']?.version, '19.2.8'],
            ['resolved @cloudflare/vite-plugin', lock.packages?.['node_modules/@cloudflare/vite-plugin']?.version, '1.50.0'],
            ['resolved react-server-dom-webpack', lock.packages?.['node_modules/react-server-dom-webpack']?.version, '19.2.8'],
            ['resolved vite', lock.packages?.['node_modules/vite']?.version, '8.2.0'],
            ['resolved wrangler', lock.packages?.['node_modules/wrangler']?.version, '4.114.0'],
            ['overridden postcss', lock.packages?.['node_modules/postcss']?.version, '8.5.18'],
            ['overridden sharp', lock.packages?.['node_modules/sharp']?.version, '0.35.0'],
            ['overridden @esbuild-kit esbuild', lock.packages?.['node_modules/@esbuild-kit/core-utils/node_modules/esbuild']?.version, '0.25.12'],
          ];
          for (const [name, actual, expected] of checks) {
            if (actual !== expected) throw new Error(`${name}: expected ${expected}, got ${actual}`);
          }
          NODE

      - name: Ensure manifest was not rewritten
        run: git diff --exit-code -- package.json

      - name: Install exact locked dependencies
        run: npm ci

      - name: Require a clean dependency audit
        run: npm audit --audit-level=low

      - name: Lint
        run: npm run lint

      - name: Build and test
        run: npm test

      - name: Commit validated lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git rm .github/workflows/security-patch.yml
          git commit -m 'Lock validated security dependency updates'
          git push origin HEAD:agent/patch-react-rsc-cve-2026-44907
